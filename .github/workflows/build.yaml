name: "build"
on: [ "push" ]
jobs:
  build-ngxv:
    name: "Build ngxv.org"
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/cache@v4"
        with:
          path: |
            .cache/deno
            ~/.deno
            ~/.dart-sass
          key: "deno-cache-${{ hashFiles('./deno.lock', './script/travis-install-dependencies') }}"
      - run: "bash ./script/travis-install-dependencies"
      - run: "bash ./script/build-web-prod"
